[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tool-result-reducer"
version = "0.2.4"
description = "Shrink large JSON tool results for LLM agents without silently losing data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ajeet Singh Kushwaha" }]
keywords = ["llm", "agents", "tool-calling", "context-window", "json"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/AryabhattaLabs/agent-tool-result-reducer"
Issues = "https://github.com/AryabhattaLabs/agent-tool-result-reducer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tool_result_reducer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
